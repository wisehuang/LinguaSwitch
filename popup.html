<!DOCTYPE html>
<html lang="en">
<head>
  <title>LinguaSwitch</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="popup-page">
  <main class="container">
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">文<span>A</span></div>
      <div class="brand-copy">
        <h1>LinguaSwitch</h1>
        <p>A little closer, in every language.</p>
      </div>
      <button id="openOptions" class="icon-button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>

    <section class="input-container text-panel" aria-labelledby="inputLabel">
      <div class="panel-heading">
        <label id="inputLabel" for="inputText">Your text</label>
        <span class="eyebrow">AUTO DETECT</span>
      </div>
      <textarea id="inputText" placeholder="Enter text to translate..."></textarea>
    </section>

    <div class="translation-controls">
      <div class="language-selector-container">
        <label for="targetLanguage">Translate to</label>
        <select id="targetLanguage">
          <option value="zh-TW" selected>Traditional Chinese</option>
          <option value="ja">Japanese</option>
          <option value="ko">Korean</option>
          <option value="en">English</option>
          <option value="zh-CN">Simplified Chinese</option>
        </select>
      </div>
      <div class="button-container">
        <button id="translateBtn" class="primary-button">Translate <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <section class="output-container text-panel" aria-labelledby="outputLabel">
      <div class="panel-heading">
        <h2 id="outputLabel">Translation</h2>
        <button id="copyBtn" class="copy-btn" title="Copy to clipboard">Copy</button>
      </div>
      <div id="loadingIndicator" class="hidden" role="status">
        <div class="spinner" aria-hidden="true"></div>
        <p>Translating...</p>
      </div>
      <div class="output-wrapper">
        <div id="outputText" class="output" aria-live="polite"></div>
      </div>
    </section>

    <footer class="footer">
      <div class="language-indicator" role="status">
        <span id="detectedLanguage">Detected language: </span>
      </div>
      <button id="clearBtn" class="text-button">Clear</button>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
